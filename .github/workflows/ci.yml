# PLANTILLA DE ESTUDIANTES: PIPELINE DE MAIN
# Copiar a .github/workflows/ci.yml en tu fork.
# Python, pytest, Docker y los mensajes de despliegue YA ESTÁN CONFIGURADOS.
# Tu misión es definir cuándo corre y en qué orden se ejecutan los jobs.

name: Main - CI/CD Lab

on:
  push:
    # TODO 1: rama que recibe los merges.
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Run All Service Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Ejecutar pruebas
        run: bash scripts/test.sh

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    # TODO 2: build espera a test.
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen localmente
        run: docker build -t sre-academy-app:${{ github.sha }} .

  deploy-staging:
    name: Staging (SIMULACIÓN)
    runs-on: ubuntu-latest
    # TODO 3: staging espera a build.
    needs: build
    steps:
      - name: Simular despliegue a staging
        run: |
          echo "Desplegando a STAGING el commit ${{ github.sha }}"
          echo "SIMULACIÓN: no se despliega ningún servicio real"

  deploy-production:
    name: Production (SIMULACIÓN)
    runs-on: ubuntu-latest
    # TODO 4: production espera a deploy-staging.
    needs: deploy-staging
    steps:
      - name: Simular despliegue a producción
        run: |
          echo "Desplegando a PRODUCTION el commit ${{ github.sha }}"
          echo "SIMULACIÓN: no se despliega ningún servicio real"

# PREGUNTA: ¿Qué sucedería si no completaras los needs?
# RESPUESTA: Los 4 jobs correrían en paralelo. Staging y production "desplegarían" aunque las pruebas o el build fallaran, porque nada los obliga a esperar.
